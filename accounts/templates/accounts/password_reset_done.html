{% extends 'base.html' %}
{% load static %}

{% block title %}Check your email - RS Couriers{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'accounts/css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-card">
    <h2 class="auth-title">Check your email</h2>
    <p class="auth-help">If an account exists for that email, we've sent a link to reset your password.</p>
    <p class="auth-switch"><a href="{% url 'accounts:login' %}">Back to log in</a></p>
</div>
{% endblock %}
